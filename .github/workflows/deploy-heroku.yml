name: Verify and deploy to Heroku

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_revision:
        description: Previously verified revision to compare before this manual release
        required: true
        type: string

permissions:
  contents: read

# Serialize this repository's releases; an API timeout is reconciled manually.
concurrency:
  group: heroku-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  merge-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out incoming history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use the locked Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Reject merges that absorb changed history without its content
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_revision }}
          HEAD_REV: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            checked_base=$(git rev-parse --verify --end-of-options "$BASE_REV^{commit}")
            checked_head=$(git rev-parse --verify --end-of-options "$HEAD_REV^{commit}")
            if [ "$checked_base" = "$checked_head" ] || ! git merge-base --is-ancestor "$checked_base" "$checked_head"; then
              echo "Manual release requires a prior verified ancestor, not the release revision itself." >&2
              exit 1
            fi
          fi
          node scripts/check-merge-integrity.mjs --base "$BASE_REV" --head "$HEAD_REV"

  verify:
    needs: merge-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: verification
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: verification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verification -d verification"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use the locked Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Run the complete release gate
        env:
          DATABASE_TEST_URL: postgresql://verification:disposable-ci-only@127.0.0.1:5432/verification
          DATABASE_TEST_URL_UNPOOLED: postgresql://verification:disposable-ci-only@127.0.0.1:5432/verification
        run: node scripts/verify-release.mjs --revision "$GITHUB_SHA"
      - name: Preserve verified source and attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-source-${{ github.sha }}
          path: |
            .release/source.tgz
            .release/verification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [merge-integrity, verify]
    # Pull requests and manual runs from other branches can only verify.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: heroku
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use the locked Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Download this run's verified source
        uses: actions/download-artifact@v4
        with:
          name: verified-source-${{ github.sha }}
          path: .release
      - name: Deploy and verify the current release
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: unified-front-door
          HEROKU_APP_ORIGIN: https://unified-front-door-39166fd63d66.herokuapp.com
          HEROKU_BASIC_AUTH_USER: ${{ vars.HEROKU_BASIC_AUTH_USER || 'guest' }}
          HEROKU_BASIC_AUTH_PASSWORD: ${{ secrets.HEROKU_BASIC_AUTH_PASSWORD }}
        run: node scripts/deploy-heroku.mjs
